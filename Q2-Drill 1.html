<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Guide to Pickleball</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS for specific styling -->
    <style>
        body {
            background-image: url('https://static.vecteezy.com/system/resources/previews/035/916/700/non_2x/cool-editable-pickleball-background-for-any-graphic-purpose-vector.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
        }

        .title-banner {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 12px 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.5rem;
            color: #212529;
        }

        .info-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
            padding: 20px;
            height: 100%;
        }

        .card-header-yellow {
            background-color: #e0ca3c;
            color: #212529;
            font-weight: bold;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card ul {
            padding-left: 20px;
            margin-bottom: 0;
            color: #333333;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container my-4 text-center">
        <!-- Title Header -->
        <div class="row justify-content-center mb-4">
            <div class="col-auto">
                <div class="title-banner">
                    <span>🟡</span> Beginner's Guide to Pickleball
                </div>
            </div>
        </div>

        <!-- Center Graphic/Icon -->
        <div class="row justify-content-center my-3">
            <div class="col-auto text-center" style="font-size: 4rem;">
            
            </div>
        </div>

        
        <div class="row pg-4 justify-content-center mt-2">
            
        
            <div class="col-12 col-md-4">
                <div class="info-card text-start">
                    <div class="card-header-yellow">
                        <span></span> Basic Rules
                    </div>
                    <ul>
                        <li>Serve diagonally</li>
                        <li>Double bounce rule</li>
                        <li>Scoring</li>
                    </ul>
                </div>
            </div>

    
            <div class="col-4">
                <div class="info-card text-start">
                    <div class="card-header-yellow">
                Pickleball Equipment
                    </div>
                    <ul>
                        <li>Paddle</li>
                        <li>Plastic ball</li>
                        <li>Net</li>
                    
                    </ul>
                </div>
            </div>

    
            <div class="col-4">
                <div class="info-card text-start">
                    <div class="card-header-yellow">
                        <span></span> Simple Techniques
                    </div>
                    <ul>
        
                        <li>Aim ball </li>
                        <li>Dinking</li>
                        <li>Positioning</li>
                </ul>
            </div>
            </div>
            </div>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <footer>
        &copy;2026 | Skyler Jacob A. Yu 
    </footer>
    
</body>
</html>
